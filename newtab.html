<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdowns</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="page">
    <div class="dashboard-layout">
      <aside id="research-left" class="research-column" aria-label="Milestone inspiration"></aside>
      <section class="central-dashboard">
        <section id="dashboard" aria-live="polite"></section>
        <p id="dashboard-message" class="dashboard-message"></p>
        <p class="manage-note">Use the extension toolbar icon to manage countdowns.</p>
        <section class="google-area" aria-label="Google search">
          <a href="https://www.google.com/" aria-label="Google">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
          </a>
          <form id="search-form" class="search-form" action="https://www.google.com/search" method="get">
            <label class="sr-only" for="search-input">Search</label>
            <input id="search-input" name="q" type="search" autocomplete="off">
          </form>
        </section>
      </section>
      <aside id="research-right" class="research-column" aria-label="Milestone inspiration"></aside>
    </div>
  </main>
  <script src="shared-storage.js"></script>
  <script src="countdown.js"></script>
  <script src="research.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
